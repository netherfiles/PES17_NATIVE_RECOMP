name: Compilar APK PES17

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar Código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v2

    - name: Instalar CMake e Capstone
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build pkg-config git
        git clone https://github.com/capstone-engine/capstone.git
        cd capstone
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.1.8937393/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 ..
        make -j4
        sudo make install

    - name: Compilar APK com Gradle
      run: |
        gradle wrapper
        ./gradlew assembleDebug

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: PES17-APK
        path: app/build/outputs/apk/debug/app-debug.apk
