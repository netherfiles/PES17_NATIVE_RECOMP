name: Compilar PES17 Nativo

on:
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar o Android NDK (r25c)
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Instalar CMake e Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build

    - name: Compilar o Projeto
      run: |
        mkdir build
        cd build
        cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 ..
        ninja

    - name: Salvar o arquivo compilado (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: pes17-libs
        path: build/ # Vai pegar tudo que foi gerado na pasta build
