name: Compilar Host Termux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar Código
      uses: actions/checkout@v4

    - name: Instalar Dependências (CMake e Capstone)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build pkg-config git
        git clone https://github.com/capstone-engine/capstone.git
        cd capstone
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=OFF ..
        make -j4
        sudo make install

    - name: Compilar o Executável (pes17_host)
      run: |
        mkdir build
        cd build
        cmake -G Ninja ..
        ninja

    - name: Salvar o Executável
      uses: actions/upload-artifact@v4
      with:
        name: pes17-host-termux
        path: build/pes17_host
