name: Compilar APK PES17

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar Código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Instalar NDK e CMake
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

    - name: Compilar Capstone (Estático)
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config git
        git clone https://github.com/capstone-engine/capstone.git
        cd capstone
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/capstone_install \
              ..
        make -j4
        make install

    - name: Compilar APK com Gradle
      run: |
        gradle wrapper
        ./gradlew assembleDebug -PCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/capstone_install

    - name: Salvar o APK
      uses: actions/upload-artifact@v4
      with:
        name: PES17-APK
        path: app/build/outputs/apk/debug/app-debug.apk
