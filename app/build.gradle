plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pes17.recomp'
    compileSdk 33

    defaultConfig {
        applicationId "com.pes17.recomp"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                def capstonePath = project.findProperty("CMAKE_PREFIX_PATH") ?: ""
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_PREFIX_PATH=${capstonePath}"
            }
        }
    }

    # ISSO AQUI VAI CONSERTAR O JAVA
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.22.1"
        }
    }
}
