plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pes17.recomp'
    compileSdk 34

    defaultConfig {
        applicationId "com.pes17.recomp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wl,-z,max-page-size=16384"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.22.1"
        }
    }
}
